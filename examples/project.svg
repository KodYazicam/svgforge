<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="258" viewBox="0 0 640 258" role="img" aria-label="svgforge">

  <rect width="640" height="258" rx="16" fill="#0f0c29" stroke="#302b63"/>
  <text x="28" y="38" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">svgforge</text>
  <text x="28" y="60" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">github.com/KodYazicam/svgforge</text>
  <text x="28" y="88" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Thirty-two README card types from one offline CLI. Zero runtime</text>
  <text x="28" y="110" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">dependencies, no network, no render API.</text>
  <text x="28" y="158" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Card types</text>
  <text x="28" y="180" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">32</text>
  <text x="223" y="158" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Themes</text>
  <text x="223" y="180" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">22</text>
  <text x="417" y="158" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Runtime deps</text>
  <text x="417" y="180" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">0</text>
  <rect x="28" y="206" width="102" height="24" rx="12" fill="#24243e" stroke="#302b63"/>
  <text x="79" y="222" text-anchor="middle" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">TypeScript</text>
  <rect x="140" y="206" width="87" height="24" rx="12" fill="#24243e" stroke="#302b63"/>
  <text x="183.5" y="222" text-anchor="middle" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Node 22+</text>
  <rect x="237" y="206" width="80" height="24" rx="12" fill="#24243e" stroke="#302b63"/>
  <text x="277" y="222" text-anchor="middle" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Offline</text>

